name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # A real Postgres so the teardown role-drop tests run as a non-superuser
    # owner, the way the customer's database (Neon) runs it (RC1-640).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m kit registry
      - run: uv run python -m kit requirements --check
      # tests/test_release_live.py verifies the committed v0.1.2 release
      # against Sigstore's public trust root (network, like a real install).
      - run: uv run pytest
        env:
          CIK_TEST_PG_ADMIN_URL: postgresql://postgres:ci-only@localhost:5432/postgres

  # ADR 0002 / ADR 0009: the triage runtime's identity holds nothing and its
  # network reaches only the allowlisted hosts. Re-proven on every change.
  triage-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f triage/compose.yaml build
      - run: mkdir -p triage/in triage/case-store
      - run: >-
          docker compose -f triage/compose.yaml run --rm --entrypoint python
          triage -I /app/isolation_test.py
        env:
          # A stand-in: the proxy refuses by name and port, so any customer
          # database hostname proves the same policy.
          PROBE_PG_HOST: ep-example-123456.us-east-2.aws.neon.tech
