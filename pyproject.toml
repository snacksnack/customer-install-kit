[project]
name = "customer-install-kit"
version = "0.1.0"
description = "Install, conformance, and remote triage for an app running in a customer environment the vendor cannot see"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "api-compatibility-lab",
    "cryptography>=44",
    "psycopg[binary]>=3.3.8",
    "sigstore==4.5.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
api-compatibility-lab = { git = "https://github.com/snacksnack/api-compatibility-lab", rev = "cc37d57301cc9c764031e9077a596efed015d874" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
