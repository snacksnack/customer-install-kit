[project]
name = "customer-install-kit"
version = "0.1.0"
description = "Install, conformance, and remote triage for an app running in a customer environment the vendor cannot see"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "api-compatibility-lab",
    "cryptography>=44",
    "psycopg[binary]>=3.3.8",
    "sigstore==4.5.1",
]

[dependency-groups]
# The shared eval harness, pinned by tag (RC1-644). Not the llmobs extra: it
# turns on ddtrace's Anthropic integration, which would trace prompts that
# carry bundle content (ADR 0009). pyyaml reads triage/compose.yaml.
evals = [
    "agent-evals[sql] @ git+https://github.com/snacksnack/agent-evals@v0.6.3",
    "pyyaml>=6",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "ddtrace>=4.14,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
api-compatibility-lab = { git = "https://github.com/snacksnack/api-compatibility-lab", rev = "cc37d57301cc9c764031e9077a596efed015d874" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["planted_values: holds planted secrets or PII; never run under --ddtrace"]

[tool.coverage.run]
source = ["kit"]
