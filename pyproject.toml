[project]
name = "customer-install-kit"
version = "0.1.0"
description = "Install, conformance, and remote triage for an app running in a customer environment the vendor cannot see"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
