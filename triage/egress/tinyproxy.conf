# Egress for the triage runtime: default deny (RC1-643, ADR 0009).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20
LogLevel Info
DisableViaHeader Yes
# Only the internal triage network reaches this proxy at all; Docker's
# private ranges are allowed here so the triage container can connect.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS tunnels only, and only on 443: no plain HTTP fetches, no 5432.
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/filter"
